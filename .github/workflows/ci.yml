name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No lockfile is committed on purpose (the only dependency is esbuild,
      # used at build time), so this is `install` rather than `ci`.
      - name: Install build dependency
        run: npm install --no-audit --no-fund

      - name: Build lib/ from src/
        run: npm run build

      # lib/ is committed because users install the prebuilt package and should
      # not need esbuild themselves. A build that disagrees with the committed
      # lib/ means someone edited src/ without rebuilding.
      - name: lib/ matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::lib/ is out of date - run npm run build and commit the result"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Pre-push checks
        run: node scripts/pre-push-check.mjs
